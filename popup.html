<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick Broadcast</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Quick Broadcast</h1>

  <div class="labelrow">
    <label for="listSelect">Send to</label>
    <button id="manageBtn" type="button" class="small">Contacts &amp; lists…</button>
  </div>
  <select id="listSelect"></select>

  <label for="list">Recipients <span class="hint">one per line: <code>9876543210, Ravi</code></span></label>
  <textarea id="list" rows="6" spellcheck="false" placeholder="9876543210, Ravi&#10;+91 98450 12345, Priya&#10;9123456780"></textarea>
  <div id="parseInfo" class="hint"></div>

  <label for="message">Message <span class="hint"><code>{name}</code> is replaced per recipient</span></label>
  <textarea id="message" rows="5" placeholder="Hi {name}, …"></textarea>

  <div class="row">
    <label>Country code <input id="cc" type="text" inputmode="numeric" value="91"></label>
    <label>Delay min (s) <input id="minDelay" type="number" min="3" value="8"></label>
    <label>Delay max (s) <input id="maxDelay" type="number" min="3" value="20"></label>
    <label>Daily cap <input id="dailyCap" type="number" min="1" value="150"></label>
  </div>

  <label class="check"><input id="fastMode" type="checkbox" checked> Fast mode: open chats without reloading the page
    <span class="hint">(falls back to a page load for any number it can't match to exactly one contact)</span></label>

  <div class="row buttons">
    <button id="start" type="button" class="primary">Start</button>
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Reset</button>
  </div>

  <section id="status" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <div id="counts"></div>
    <div id="note" class="note"></div>
    <details id="failedBox" hidden>
      <summary>Failed (<span id="failedCount">0</span>)</summary>
      <ul id="failedList"></ul>
      <button id="copyFailed" type="button">Copy failed numbers</button>
    </details>
  </section>

  <p id="error" class="error" hidden></p>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
